name: Package Application

on:
  push:
    tags:
      - v*
      - '*.*.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or source ref to package.
        required: true
        default: v0.1.0
      package_version:
        description: Package version used in artifact names and manifests.
        required: true
        default: 0.1.0
      deployment_profile:
        description: Deployment profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - standalone
          - cloud
      runtime_target:
        description: Runtime target filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - browser
      platform:
        description: Platform filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - h5
      architecture:
        description: Architecture filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - universal
      profile:
        description: Package profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - browser
      variant:
        description: Package variant filter.
        required: true
        default: all
      format:
        description: Package format filter.
        required: true
        default: all
      deploy:
        description: Run configured deployment environments after packaging.
        required: true
        default: false
        type: boolean
      sdkwork_specs_ref:
        description: 'SDKWORK_SPECS_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    uses: sdkwork-ai/sdkwork-github-workflow/.github/workflows/sdkwork-package.yml@v1
    with:
      config_path: agent.workflow.json
      tag: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
      package_version: ${{ github.event.inputs.package_version || github.event.release.tag_name || github.ref_name }}
      deployment_profile: ${{ github.event.inputs.deployment_profile || 'all' }}
      runtime_target: ${{ github.event.inputs.runtime_target || 'all' }}
      platform: ${{ github.event.inputs.platform || 'all' }}
      architecture: ${{ github.event.inputs.architecture || 'all' }}
      profile: ${{ github.event.inputs.profile || 'all' }}
      variant: ${{ github.event.inputs.variant || 'all' }}
      format: ${{ github.event.inputs.format || 'all' }}
      publish_release: true
      upload_artifact: true
      deploy: ${{ github.event.inputs.deploy == 'true' || github.event_name == 'release' }}
      retention_days: 30
      framework_ref: v1
      dependency_refs_json: >-
        {
                    "SDKWORK_SPECS_REF": "${{ github.event.inputs.sdkwork_specs_ref || vars.SDKWORK_SPECS_REF }}"
        }
    secrets: inherit
